services:
  universal-job-alert-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-job-alert-bot
    command: ["python3", "/app/universal_job_alert_bot.py"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_FILE=/app/data/seen_jobs.db
      - ENV_FILE=/app/.env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./universal_job_alert_bot.py:/app/universal_job_alert_bot.py:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
